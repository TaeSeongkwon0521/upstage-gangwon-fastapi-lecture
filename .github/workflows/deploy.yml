name: Deploy to EC2 K8s

on:
  push:
    branches:
      - deploy/version

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image meta (lowercase owner)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(
            python - <<'PY'
import re, pathlib
txt = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
m = re.search(r'(?m)^\s*version\s*=\s*"?([^"\n]+)"?\s*$', txt)
if not m:
    raise SystemExit('Cannot find "version = ..." in pyproject.toml')
print(m.group(1).strip())
PY
          )

          HASH=$(git rev-parse --short=7 HEAD)
          TAG="${VERSION}-${HASH}"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build & Push Docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.meta.outputs.owner_lc }}/gangwon-taeseong"
          TAG="${{ steps.version.outputs.tag }}"
          echo "IMAGE=$IMAGE"
          echo "TAG=$TAG"
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE}:${TAG}" \
            --push .

      - name: Deploy to K8s via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/workspace3/upstage-gangwon-fastapi-lecture

            IMAGE="ghcr.io/${{ steps.meta.outputs.owner_lc }}/gangwon-taeseong:${{ steps.version.outputs.tag }}"
            echo "Deploying IMAGE=$IMAGE"

            sed -i "s|image: .*gangwon-taeseong.*|image: $IMAGE|" infra/k8s/application/04-backend.yaml
            kubectl apply -n taeseong -f infra/k8s/application/04-backend.yaml

