name: Deploy to EC2 K8s

on:
  push:
    branches:
      - deploy/version

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image meta (lowercase owner)
        id: meta
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        run: |
          IMAGE=ghcr.io/${{ steps.meta.outputs.owner_lc }}/gangwon-taeseong
          docker buildx build \
            --platform linux/amd64 \
            -t $IMAGE:${{ steps.version.outputs.tag }} \
            --push .

      - name: Deploy to K8s via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/workspace3/upstage-gangwon-fastapi-lecture

            IMAGE=ghcr.io/${{ steps.meta.outputs.owner_lc }}/gangwon-taeseong:${{ steps.version.outputs.tag }}
            
            sed -i "s|image: .*gangwon-taeseong.*|image: $IMAGE|" infra/k8s/application/04-backend.yaml

            kubectl apply -n taeseong -f infra/k8s/application/04-backend.yaml

