name: EC2 K8s Deploy (Versioned)

on:
  push:
    branches:
      - deploy/version

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: gangwon-taeseong
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Version
        id: version
        run: |
          VER=$(grep '^version' pyproject.toml | cut -d '"' -f2)
          HASH=$(git rev-parse --short=7 HEAD)
          TAG="${VER}-${HASH}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy on EC2 Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /home/ubuntu/workspace3/upstage-gangwon-fastapi-lecture

            git checkout deploy/version
            git pull

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}"

            FILE=infra/k8s/application/04-backend.yaml
            cp $FILE ${FILE}.bak
            sed -i "s|^\(\s*image:\s*\).*|\1$IMAGE|g" $FILE

            kubectl apply -f $FILE
            mv ${FILE}.bak $FILE

