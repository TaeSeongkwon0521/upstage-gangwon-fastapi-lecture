name: Deploy to EC2 K8s

on:
  push:
    branches:
      - deploy/version

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d '"' -f2)
          HASH=$(git rev-parse --short=7 HEAD)
          TAG="${VERSION}-${HASH}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/gangwon-taeseong
          docker buildx build \
            --platform linux/amd64 \
            -t $IMAGE:${{ steps.version.outputs.tag }} \
            --push .

      - name: Deploy to K8s via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/workspace3/upstage-gangwon-fastapi-lecture

            IMAGE=ghcr.io/${{ github.repository_owner }}/gangwon-taeseong:${{ steps.version.outputs.tag }}

            sed -i "s|image: .*gangwon-taeseong.*|image: $IMAGE|" infra/k8s/application/04-backend.yaml

            kubectl apply -n taeseong -f infra/k8s/application/04-backend.yaml

